<!doctype html>
<html
  lang="en"
  data-theme="paper"
  data-font="serif"
  data-align="left"
  data-spacing="normal"
  data-width="normal"
>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="3NDING" />
    <meta name="theme-color" content="#fbfbf8" />
    <title>Reader — 3NDING</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Google Fonts: loaded without blocking the first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Literata:opsz,wght@7..72,400..700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Literata:opsz,wght@7..72,400..700&display=swap"
      />
    </noscript>
    <script>
      /* Apply saved theme before first paint to avoid a white flash */
      try {
        const s = JSON.parse(localStorage.getItem("lib.settings")) || {};
        for (const k of ["theme", "font", "align", "spacing", "width"])
          if (s[k]) document.documentElement.dataset[k] = s[k];
      } catch {}
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="reader">
    <header class="r-bar">
      <a
        class="icon-btn"
        id="back"
        href="index.html"
        aria-label="Back to library"
      ></a>
      <div class="r-title">
        <strong id="book-title">Loading…</strong
        ><span id="chapter-title"></span>
      </div>
      <button
        class="icon-btn"
        id="btn-toc"
        type="button"
        aria-label="Chapters"
        aria-controls="toc"
        aria-expanded="false"
      ></button>
      <button
        class="icon-btn"
        id="btn-settings"
        type="button"
        aria-label="Reading settings"
        aria-controls="settings"
        aria-expanded="false"
      ></button>
      <button
        class="icon-btn"
        id="btn-fs"
        type="button"
        aria-label="Full screen"
      ></button>
      <div class="r-progress" aria-hidden="true"><i id="bar"></i></div>
    </header>

    <button
      class="icon-btn"
      id="exit-fs"
      type="button"
      aria-label="Exit full screen"
    ></button>

    <main>
      <article id="text" tabindex="-1">
        <p class="r-state">Opening book…</p>
      </article>
      <nav class="r-foot" aria-label="Chapter navigation">
        <button class="btn" id="prev" type="button">Previous</button>
        <span id="pos"></span>
        <button class="btn btn-primary" id="next" type="button">Next</button>
      </nav>
    </main>

    <div class="scrim" id="scrim"></div>

    <aside class="panel" id="toc" aria-label="Chapters">
      <header>
        <h2>Chapters</h2>
        <button
          class="icon-btn"
          type="button"
          data-close
          aria-label="Close"
        ></button>
      </header>
      <ol class="toc" id="toc-list"></ol>
    </aside>

    <aside class="panel" id="settings" aria-label="Reading settings">
      <header>
        <h2>Reading settings</h2>
        <button
          class="icon-btn"
          type="button"
          data-close
          aria-label="Close"
        ></button>
      </header>
      <div class="group">
        <span>Font</span>
        <div class="seg" data-key="font">
          <button
            type="button"
            data-val="serif"
            style="font-family: var(--serif)"
          >
            Serif
          </button>
          <button
            type="button"
            data-val="sans"
            style="font-family: var(--sans)"
          >
            Sans
          </button>
          <button
            type="button"
            data-val="mono"
            style="font-family: var(--mono)"
          >
            Mono
          </button>
        </div>
      </div>
      <div class="group">
        <span>Theme</span>
        <div class="seg themes" data-key="theme">
          <button type="button" data-val="paper">Paper</button>
          <button type="button" data-val="sepia">Sepia</button>
          <button type="button" data-val="dark">Dark</button>
          <button type="button" data-val="oled">OLED</button>
        </div>
      </div>
      <div class="group">
        <span>Font size</span>
        <div class="size">
          <input
            type="range"
            id="size"
            min="14"
            max="32"
            step="1"
            aria-label="Font size"
          />
          <output id="size-out" for="size"></output>
        </div>
      </div>
      <div class="group">
        <span>Alignment</span>
        <div class="seg" data-key="align">
          <button type="button" data-val="left">Left</button>
          <button type="button" data-val="justify">Justify</button>
        </div>
      </div>
      <div class="group">
        <span>Line spacing</span>
        <div class="seg" data-key="spacing">
          <button type="button" data-val="compact">Compact</button>
          <button type="button" data-val="normal">Normal</button>
          <button type="button" data-val="relaxed">Relaxed</button>
        </div>
      </div>
      <div class="group">
        <span>Text width</span>
        <div class="seg" data-key="width">
          <button type="button" data-val="narrow">Narrow</button>
          <button type="button" data-val="normal">Normal</button>
          <button type="button" data-val="wide">Wide</button>
        </div>
      </div>
      <p class="hint">
        Tip: use ← → keys or swipe left/right to change chapters. Esc closes
        panels.
      </p>
      <button class="btn" id="reset" type="button" style="width: 100%"></button>
    </aside>

    <script src="js/app.js"></script>
    <script src="js/reader.js"></script>
  </body>
</html>
