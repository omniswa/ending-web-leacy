<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>3NDING — Favorites</title>
    <meta
      name="theme-color"
      content="#f5f6f8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f1218"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="3NDING" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- Google Fonts: loaded without blocking the first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Literata:opsz,wght@7..72,400..700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=JetBrains+Mono:wght@400..600&family=Literata:opsz,wght@7..72,400..700&display=swap"
      />
    </noscript>

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">3NDING</a>
      <nav aria-label="Main">
        <a href="index.html" data-icon="book"
          ><span class="lbl">Browse</span></a
        >
        <a href="favorites.html" data-icon="heart" aria-current="page"
          ><span class="lbl">Favorites</span
          ><span id="fav-count" hidden></span
        ></a>
      </nav>
    </header>

    <main class="page">
      <h1 class="page-title">Your favorites</h1>
      <p class="page-sub" id="summary"></p>
      <div class="tabs" role="group" aria-label="Filter favorites">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="reading" aria-pressed="false">
          Unfinished
        </button>
        <button type="button" data-filter="finished" aria-pressed="false">
          Finished
        </button>
      </div>
      <ul class="fav-list" id="list"></ul>
      <div class="empty" id="empty" hidden></div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/favorites.js"></script>
  </body>
</html>
